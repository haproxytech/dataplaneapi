# _version=42

global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    stats socket /var/lib/haproxy/stats level admin
    filter-api default

defaults filter_defaults
    mode http
    filter-config trace id A
    filter-config trace id B
    filter-enable trace/A

defaults mydefaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option http-server-close
    option forwardfor       except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           10s
    maxconn                 3000

frontend test_frontend
    mode http
    bind :80
    maxconn 1000
    option httpclose
    filter-config trace id A
    filter-config trace id B
    filter-enable trace/A

backend test_backend
    mode http
    balance roundrobin
    option forwardfor
    filter-config trace id A
    filter-config trace id B
    filter-enable trace/A
