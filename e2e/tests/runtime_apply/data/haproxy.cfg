# explicit "from" on purpose: without it the first raw POST after a dataplaneapi start reloads
global
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  maxconn 4000
  pidfile /var/run/haproxy.pid
  stats socket /var/lib/haproxy/stats level admin
  log 127.0.0.1 local2

defaults d_chain
  mode http
  timeout connect 10s
  timeout client 1m
  timeout server 1m
  default-server check port 8999 weight 13

defaults mydefaults
  mode http
  maxconn 3000
  log global
  option httplog
  option dontlognull
  timeout http-request 10s
  timeout check 10s
  timeout connect 10s
  timeout client 1m
  timeout queue 1m
  timeout server 1m
  retries 3

frontend fe_main from mydefaults
  bind 127.0.0.1:9080
  maxconn 1000
  default_backend be_plain

backend be_plain from mydefaults
  balance roundrobin
  server srv1 10.0.1.1:8080 weight 10
  server srv2 10.0.1.2:8080 weight 20
  server srv3 10.0.1.3:8080 weight 30

backend be_defsrv from mydefaults
  balance roundrobin
  default-server check inter 2s weight 7
  server srv1 10.0.2.1:8080
  server srv2 10.0.2.2:8080

backend be_chain from d_chain
  balance roundrobin
  server srv1 10.0.3.1:8080
